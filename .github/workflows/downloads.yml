name: NuGet downloads

# Once a day, reads the download counts of the NuGet packages and keeps the issue
# "NuGet downloads" up to date. A comment is added, which notifies the repository
# owner, whenever a count goes up. See scripts/nuget-downloads.js.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/downloads.yml
      - scripts/nuget-downloads.js

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const report = require('./scripts/nuget-downloads.js');
            await report({ github, context, core });
