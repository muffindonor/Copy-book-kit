name: Release

# Runs when a tag such as v0.1.0 is pushed. It tests the code, checks that the tag
# matches the version in src/Directory.Build.props, and publishes both packages to NuGet
# with Trusted Publishing, so no API key is stored.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # lets NuGet check that this workflow, in this repository, is the one publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Check the tag matches the version
        run: |
          version=$(dotnet msbuild src/CopybookKit -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in src/Directory.Build.props."
            exit 1
          fi
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build
      - run: dotnet pack -c Release --no-build -o artifacts
      - name: Log in to NuGet with Trusted Publishing
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
